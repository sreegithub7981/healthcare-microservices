name: Healthcare CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  auth-service:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auth_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d auth_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: auth-service
        run: |
          pip install -r requirements.txt

      - name: Run tests
        working-directory: auth-service
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/auth_db
        run: |
          python -m pytest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: auth-service
        run: |
          docker build -t healthcare-auth-service:test .

      - name: Tag Docker image
        run: |
          docker tag healthcare-auth-service:test 923870246789.dkr.ecr.ap-south-1.amazonaws.com/healthcare-auth-service:latest

      - name: Push Docker image to ECR
        run: |
          docker push 923870246789.dkr.ecr.ap-south-1.amazonaws.com/healthcare-auth-service:latest