name: Healthcare CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  auth-service:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: auth-service
        run: |
          pip install -r requirements.txt

      - name: Run tests
        working-directory: auth-service
        run: |
          python -m pytest

      - name: Build Docker image
        working-directory: auth-service
        run: |
          docker build -t healthcare-auth-service:test .